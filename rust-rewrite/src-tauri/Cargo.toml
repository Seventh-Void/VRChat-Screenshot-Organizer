[package]
name = "app"
version = "2.1.0"
description = "Organize VRChat screenshots by world"
authors = ["VRChat Organizer Contributors"]
license = "MIT"
repository = "https://github.com/Seventh-Void/VRChat-Screenshot-Organizer"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.3", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
arboard = "3"
organizer-core = { path = "../crates/organizer-core" }
shellexpand = "3"
notify = "7"
walkdir = "2"
sysinfo = "0.33"
