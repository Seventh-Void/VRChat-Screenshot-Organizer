[package]
name = "organizer-core"
version = "2.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["clock"] }
regex = "1"
walkdir = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
kamadak-exif = "0.5"
flate2 = "1"
crc32fast = "1"
rayon = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
fast_image_resize = "5"
