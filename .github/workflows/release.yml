name: Build Release Artifacts

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable

      - name: Read application version
        id: version
        shell: bash
        run: echo "version=$(sed -n 's/^version = "\(.*\)"/\1/p' rust-rewrite/src-tauri/Cargo.toml | head -n 1)" >> "$GITHUB_OUTPUT"

      - name: Install system dependencies (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Install appimagetool (pinned + verified)
        run: |
          curl -L --fail --proto '=https' --proto-redir '=https' -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool" | sha256sum -c -
          sudo install -m 0755 appimagetool /usr/local/bin/appimagetool
          rm appimagetool

      - name: Build Tauri App & CLI + Package AppImage
        run: ./build-appimage.sh
        env:
          # Runners lack FUSE; appimagetool unpacks itself instead.
          APPIMAGE_EXTRACT_AND_RUN: 1
        working-directory: ./rust-rewrite

      - name: Upload AppImage to Release
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./release/v${{ steps.version.outputs.version }}/VRChatOrganizer-*.AppImage
          tag: ${{ github.ref }}
          file_glob: true
          overwrite: true

  build-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust (with Windows target)
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-gnu

      - name: Read application version
        id: version
        shell: bash
        run: echo "version=$(sed -n 's/^version = "\(.*\)"/\1/p' rust-rewrite/src-tauri/Cargo.toml | head -n 1)" >> "$GITHUB_OUTPUT"

      - name: Install mingw-w64 cross-compiler
        run: sudo apt-get update && sudo apt-get install -y mingw-w64

      - name: Build Windows executable
        run: ./build-windows.sh
        working-directory: ./rust-rewrite

      - name: Upload Windows EXE to Release
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./release/v${{ steps.version.outputs.version }}/VRChatOrganizer-*-windows-x86_64-cli.exe
          tag: ${{ github.ref }}
          file_glob: true
          overwrite: true

  build-windows-tauri:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable

      - name: Read application version
        id: version
        shell: bash
        run: echo "version=$(sed -n 's/^version = "\(.*\)"/\1/p' rust-rewrite/src-tauri/Cargo.toml | head -n 1)" >> "$GITHUB_OUTPUT"

      - name: Install Tauri dependencies (WebView2 is pre-installed)
        run: |
          cargo install tauri-cli --version =2.11.4 --locked

      - name: Build portable executable and installers
        shell: pwsh
        run: |
          cargo tauri build --bundles nsis,msi
          $releaseDir = "../release/v${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Force $releaseDir | Out-Null
          Copy-Item target/release/app.exe "$releaseDir/VRChatOrganizer-${{ steps.version.outputs.version }}-windows-x86_64-portable.exe"
          Copy-Item target/release/bundle/nsis/*.exe $releaseDir
          Copy-Item target/release/bundle/msi/*.msi $releaseDir
        working-directory: ./rust-rewrite

      - name: Upload portable Windows executable
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./release/v${{ steps.version.outputs.version }}/VRChatOrganizer-*-portable.exe
          tag: ${{ github.ref }}
          file_glob: true
          overwrite: true

      - name: Upload Windows installers to Release
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./release/v${{ steps.version.outputs.version }}/*-setup.exe
          tag: ${{ github.ref }}
          file_glob: true
          overwrite: true

      - name: Upload MSI installer to Release
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./release/v${{ steps.version.outputs.version }}/*.msi
          tag: ${{ github.ref }}
          file_glob: true
          overwrite: true
